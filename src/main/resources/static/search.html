<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <title>Study Group Matching - Profile</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="menuToggle">
            <input type="checkbox" id="toggle"/>
            <div class="menuCircle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar bLast"></span>
            </div>
            <div class="menu">
                <p class="webName"><strong>Study Group Finder</strong></p>
                <img class="menuPFP" src="imgs/profilePlaceholder.png"/>
                <li><span>Profile</span></li>
                <li><span>Dashboard</span></li>
                <li><span>Find Groups</span></li>
                <li><span>Settings</span></li>
            </div>
        </div>
        <div class="profileMain">
            <div class="profCard centerer">
                <h1 class="profileName">Find Groups</h1>
            </div>
            <form class="profCard">
                <h3 class="cardHead">Enter a class code (e.g. CSC 116):</h3>
                <input type="text" class="searchInput"/>
                <h3 class="cardHead">Enter a section (optional):</h3>
                <input type="number" class="searchInput"/>
                <div class="centerer">
                    <button class="groupButton" style="margin-top: 0;">Search</button>
                </div>
            </form>
        </div>
    </body>
</html>
